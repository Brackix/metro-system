# ==============================================================================
#  Metro System — Docker Compose (Infrastructure Services)
#  Usage:  ./build.sh          (auto-detects IP, builds & runs everything)
#  Manual: API_URL=http://<IP>:4000/api docker compose up --build
#
#  Note: Expo mobile apps are NOT built here. Build them separately with:
#        ./build-apks.sh       (one-time dev APK build)
#        ./start-dev.sh        (start Metro dev servers for hot reload)
# ==============================================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: metro_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s

  # ── Backend API (Express + Prisma) ────────────────────────────────────────────
  backend:
    build:
      context: ./metro-app-backend
      dockerfile: Dockerfile
    container_name: metro_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: ${NODE_ENV}
      TURNIQUETE_URL: http://turnstile:5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:${PORT}/api/stations').then(r=>{if(!r.ok)throw 0;process.exit(0)}).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Dashboard (Next.js) ────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./metro-app-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000/api}
    container_name: metro_dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ── Web Turnstile (Express + static frontend) ────────────────────────────────
  turnstile:
    build:
      context: ./metroapp-web-turnstile
      dockerfile: Dockerfile
    container_name: metro_turnstile
    restart: always
    ports:
      - "${TURNSTILE_PORT}:5000"

volumes:
  postgres_data:
