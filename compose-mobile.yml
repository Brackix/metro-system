# ==============================================================================
#  Metro System — Docker Compose (DB + Backend only)
#  For mobile development: run the Expo app separately on the host.
#
#  Usage:
#    docker compose -f compose-mobile.yml up --build
#
#  Then on the host:
#    cd metro-app
#    adb reverse tcp:8081 tcp:8081
#    npx expo start --dev-client --port 8081
# ==============================================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: metro_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-metro_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend API (Express + Prisma) ────────────────────────────────────────────
  backend:
    build:
      context: ./metro-app-backend
      dockerfile: Dockerfile
    container_name: metro_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-metro_db}
      PORT: ${PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-*}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:${PORT:-4000}/api/stations').then(r=>{if(!r.ok)throw 0;process.exit(0)}).catch(()=>process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
